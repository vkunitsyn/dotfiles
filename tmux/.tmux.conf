# ==========================================
# MAIN SETTINGS
# ==========================================

set -g mouse on
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -s escape-time 0
set -g history-limit 50000
set -g status-interval 5

# Let Neovim receive focus events (autoread, checktime)
set -g focus-events on

# Keep tmux's default list and add NVIM. Plain `set -g` would drop the defaults
# (SSH_AUTH_SOCK etc.); the unset first keeps `prefix r` reloads from duplicating NVIM.
set -ug update-environment
set -ag update-environment "NVIM"

set -g extended-keys on
set -g extended-keys-format csi-u   # tmux >= 3.5 only
# ==========================================
# KEYBINDINGS & NAVIGATION
# ==========================================

# Reload configuration: Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes with - and |
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (Prefix + Ctrl + h/j/k/l, repeatable)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Create new window
bind c new-window -c "#{pane_current_path}"

# Prefix + g: lazygit in a popup, opened in the current pane's directory
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# ==========================================
# COPY MODE & BUFFER (Vi-mode)
# ==========================================

setw -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# ==========================================
# APPEARANCE
# ==========================================

set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#6c7086]| "

set -g status-right-length 60
set -g status-right "#[fg=#a6e3a1]%Y-%m-%d #[fg=#6c7086]| #[fg=#f9e2af]%H:%M "

setw -g window-status-format "#[fg=#6c7086] #I:#W#F "
setw -g window-status-current-format "#[fg=#a6e3a1,bold] #I:#W#F "
