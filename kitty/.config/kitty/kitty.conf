# --- Look ---
font_family Hack Nerd Font
font_size 14
background_opacity 0.95
window_padding_width 8
cursor_shape beam
cursor_blink_interval 0

# --- Behavior ---
enable_audio_bell no
mouse_hide_wait 1
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# --- Shortcuts: drop all defaults, keep only what I use ---
# Must stay above every "map" line, otherwise it wipes them too
clear_all_shortcuts yes

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Windows and app
map cmd+n new_os_window
map cmd+w close_os_window
map cmd+q quit
map cmd+h hide_macos_app
map cmd+m minimize_macos_window
map ctrl+cmd+f toggle_fullscreen
map cmd+comma edit_config_file
map ctrl+cmd+comma load_config_file

# Font size
map cmd+plus change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

# Line editing: send standard readline codes that any shell understands
map cmd+left send_text all \x01
map cmd+right send_text all \x05
map cmd+backspace send_text all \x15
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf

# Screen
map cmd+k clear_terminal to_cursor active
map cmd+shift+h show_scrollback
